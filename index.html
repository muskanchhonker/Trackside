<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161A">
<title>Trackside · 5K to 10K</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◐</span>
    <span class="brand-name">TRACKSIDE</span>
  </div>
  <div class="brand-sub">5K → 10K</div>
</header>

<main>

  <!-- HOME -->
  <section id="view-home" class="view">
    <div class="progress-card">
      <div id="progressSummary" class="progress-summary">0 / 48 sessions complete</div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <button id="continueBtn" class="btn btn-primary">Continue</button>
    </div>

    <div id="routeMap" class="route-map"></div>
  </section>

  <!-- PLAYER -->
  <section id="view-player" class="view hidden">
    <div class="player-head">
      <button id="exitBtn" class="icon-btn" aria-label="Exit session">←</button>
      <div id="playerTitle" class="player-title">Session</div>
    </div>

    <div id="segLabel" class="seg-label">Warm-up walk</div>
    <div id="timerDisplay" class="timer-display">05:00</div>
    <div id="nextUp" class="next-up">Next: Run</div>

    <div id="segDots" class="seg-dots"></div>

    <div class="player-controls">
      <button id="skipBtn" class="btn btn-ghost">Skip</button>
      <button id="startPauseBtn" class="btn btn-primary btn-large">Start</button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="view hidden">
    <h2 class="section-title">Coach voice</h2>

    <label class="setting-row">
      <span>Voice cues</span>
      <input type="checkbox" id="voiceOnToggle">
    </label>

    <label class="setting-row-col">
      <span>Trainer voice</span>
      <select id="voiceSelect"></select>
    </label>

    <label class="setting-row-col">
      <span>Speaking rate</span>
      <input type="range" id="rateRange" min="0.7" max="1.3" step="0.1">
    </label>

    <h2 class="section-title">Session</h2>
    <label class="setting-row">
      <span>Keep screen awake while running</span>
      <input type="checkbox" id="wakeLockToggle">
    </label>

    <h2 class="section-title">Data</h2>
    <p class="setting-note">Progress is stored only on this device, in this browser.</p>
    <button id="resetProgressBtn" class="btn btn-danger">Reset progress</button>
  </section>

</main>

<nav class="bottomnav">
  <button class="navbtn active" data-view="home">Route</button>
  <button class="navbtn" data-view="settings">Coach</button>
</nav>

<audio id="bgAudio" src="audio/silence.wav" loop preload="auto" playsinline style="display:none"></audio>

<script src="js/program.js"></script>
<script src="js/app.js"></script>
</body>
</html>
